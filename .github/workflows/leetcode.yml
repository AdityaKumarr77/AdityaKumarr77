name: Update LeetCode Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/leetcode_dashboard.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch LeetCode stats and render SVG
        env:
          LEETCODE_USER: AdityaKumar77
        run: python scripts/leetcode_dashboard.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh LeetCode dashboard"
          git push
